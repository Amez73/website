<!-- ===========================================================================
  SEO + social link-preview tags.
  Paste this whole block into: Project → Export → Web → Options → HTML → Head Include.
  (Godot already sets <title> from the project name, so it's not repeated here.)

  Needs a preview image: drop a 1200x630 PNG at web-extra/og-image.png so it
  deploys to https://shareefjoseph.com/og-image.png (referenced below).
  Once pasted, it's saved into export_presets.cfg and the CI build reuses it.
============================================================================ -->
<meta name="description" content="Shareef Joseph — stuff I make: games, digital art, writing, blacksmithing, bow making, and pottery.">
<link rel="canonical" href="https://shareefjoseph.com/">

<meta property="og:type" content="website">
<meta property="og:url" content="https://shareefjoseph.com/">
<meta property="og:title" content="Shareef Joseph — Portfolio">
<meta property="og:description" content="Stuff I make: games, digital art, writing, blacksmithing, bow making, pottery.">
<meta property="og:image" content="https://shareefjoseph.com/og-image.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Shareef Joseph — Portfolio">
<meta name="twitter:description" content="Stuff I make: games, digital art, writing, blacksmithing, bow making, pottery.">
<meta name="twitter:image" content="https://shareefjoseph.com/og-image.png">
