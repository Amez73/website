<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Quicksand:wght@400;600&display=swap');

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #fefae0;
	background-color: #1c1b17;
	background-image: radial-gradient(circle at 50% 50%, #2a2823 0%, #1c1b17 100%);
	overflow: hidden;
	touch-action: none;
	font-family: 'Quicksand', sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ---------- Loading overlay ---------- */
#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1c1b17;
	background-image: radial-gradient(circle at 50% 50%, #2a2823 0%, #1c1b17 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	display: none !important;
}

/* Godot splash image hidden — custom branded loader used instead */

/* Branded loader text */
#loader-brand {
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	text-align: center;
	pointer-events: none;
	z-index: 2;
}

#loader-brand h1 {
	font-family: 'DM Serif Display', serif;
	font-weight: 400;
	font-size: clamp(28px, 6vw, 56px);
	color: #d4a373;
	margin: 0 0 8px 0;
	letter-spacing: 1px;
}

#loader-brand p {
	font-family: 'Quicksand', sans-serif;
	font-size: clamp(14px, 2vw, 18px);
	color: #bc6c25;
	margin: 0 0 40px 0;
	letter-spacing: 1px;
}

#loader-brand .loader-hint {
	font-size: 13px;
	color: #8a7a63;
	margin-top: 16px;
}

/* Progress bar */
#status-progress, #status-notice {
	display: none;
}

#status-progress {
	position: absolute;
	bottom: 38%;
	left: 50%;
	transform: translateX(-50%);
	width: min(320px, 60vw);
	height: 6px;
	border: none;
	border-radius: 3px;
	background: #2d2a26;
	overflow: hidden;
	-webkit-appearance: none;
	appearance: none;
	z-index: 3;
}

#status-progress::-webkit-progress-bar {
	background: #2d2a26;
	border-radius: 3px;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #bc6c25, #d4a373);
	border-radius: 3px;
	transition: width 0.3s ease;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #bc6c25, #d4a373);
	border-radius: 3px;
}

/* Error notice */
#status-notice {
	background-color: rgba(45, 42, 38, 0.95);
	border-radius: 16px;
	border: 1px solid #bc6c25;
	color: #fefae0;
	font-family: 'Quicksand', sans-serif;
	line-height: 1.4;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1.5rem;
	text-align: center;
	z-index: 10;
	max-width: 500px;
}

/* Fallback content (crawlers, no-JS, accessibility) */
.fallback {
	max-width: 700px;
	margin: 60px auto;
	padding: 0 20px;
	text-align: center;
}

.fallback h1 {
	font-family: 'DM Serif Display', serif;
	font-weight: 400;
	font-size: 2.5rem;
	color: #d4a373;
	margin: 0 0 8px 0;
}

.fallback .tagline {
	color: #bc6c25;
	margin-bottom: 40px;
}

.fallback ul {
	list-style: none;
	padding: 0;
	display: flex;
	flex-wrap: wrap;
	gap: 16px;
	justify-content: center;
}

.fallback li a {
	display: inline-block;
	padding: 14px 32px;
	background: rgba(45, 42, 38, 0.85);
	border: 1px solid rgba(255, 255, 255, 0.08);
	border-radius: 16px;
	color: #fefae0;
	text-decoration: none;
	font-weight: 600;
	transition: border-color 0.2s;
}

.fallback li a:hover {
	border-color: #d4a373;
}

.fallback .socials {
	margin-top: 40px;
	font-size: 14px;
	color: #8a7a63;
}

.fallback .socials a {
	color: #d4a373;
	text-decoration: none;
	margin: 0 8px;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<!-- Fallback for crawlers, screen readers, and no-JS browsers -->
		<noscript>
			<div class="fallback">
				<h1>Shareef Joseph</h1>
				<p class="tagline">stuff i make</p>
				<ul>
					<li><a href="https://amez73.itch.io/cozy-courier-co">Game Dev</a></li>
					<li><a href="writing.html">Writing</a></li>
					<li><a href="https://github.com/Amez73">GitHub</a></li>
				</ul>
				<p class="socials">
					<a href="https://github.com/Amez73">GitHub</a>
					<a href="https://linkedin.com/in/shareefjoseph">LinkedIn</a>
				</p>
			</div>
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<div id="loader-brand">
				<h1>Shareef Joseph</h1>
				<p>stuff i make</p>
				<div class="loader-hint">loading&hellip;</div>
			</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
